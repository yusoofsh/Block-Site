<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/data/theme.css">
  <link rel="stylesheet" href="index.css">
  <title data-i18n="blocked_restricted"></title>
  <script type="text/javascript" src="pre.js"></script>
  <style type="text/css" id="css"></style>
  <link rel="icon" type="image/png" href="/data/icons/blocked/32.png" id="tab-icon">
</head>
<body>
  <main>
    <div class="lock">
      <!-- the locked site's icon (or its first letter) with a lock badge -->
      <div class="site-icon" aria-hidden="true">
        <img id="favicon" alt="" hidden>
        <span id="monogram"></span>
        <span class="lock-badge">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
        </span>
      </div>
      <h1>
        <a id="url" href="">
          <span id="sub-domain"></span><span id="domain">...</span>
          <span class="path"><span id="pathname"></span><span id="search"></span></span>
        </a>
      </h1>
      <p id="message"></p>

      <form>
        <div class="field">
          <input type="password" required="true" autocomplete="off"
            data-i18n="blocked_password_ph" data-i18n-value="placeholder">
          <button type="submit" id="unlock" class="btn-primary">
            <span data-i18n="blocked_unlock"></span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p id="error" role="alert"></p>
        <p id="info"></p>
      </form>
    </div>
    <!-- "remove blocking", pressed by the toolbar button on this page; not shown -->
    <a href="#" id="exception" hidden></a>
  </main>

  <notification-view id="toast"></notification-view>
  <button type="button" id="switch" class="btn-ghost" title="Theme" aria-label="Theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8"/>
      <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
    </svg>
  </button>

  <script src="/data/components/notification-view/notification-view.js"></script>
  <script src="/utils.js"></script>
  <script src="tld.js"></script>
  <script src="index.js"></script>
</body>
</html>
