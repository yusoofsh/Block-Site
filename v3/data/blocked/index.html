<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/data/theme.css">
  <link rel="stylesheet" href="index.css">
  <title data-i18n="blocked_restricted"></title>
  <script type="text/javascript" src="pre.js"></script>
  <style type="text/css" id="css"></style>
  <link rel="icon" type="image/png" href="/data/icons/32.png">
</head>
<body>
  <main>
    <section class="lock panel">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2.5"/>
          <path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
          <circle cx="12" cy="16" r="1.2" fill="currentColor"/>
        </svg>
      </div>
      <h1 data-i18n="blocked_restricted"></h1>
      <a id="url" href="">
        <span id="sub-domain"></span><span id="domain">...</span><span id="pathname"></span><span id="search"></span>
      </a>
      <p id="message"></p>

      <form>
        <p class="hint" data-i18n="blocked_locked_hint"></p>
        <fieldset>
          <legend data-i18n="blocked_unlock_for"></legend>
          <div class="choices" id="duration" role="radiogroup"
            data-i18n="blocked_unlock_duration" data-i18n-value="title"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="blocked_idle_lock"></legend>
          <div class="choices compact" id="idle" role="radiogroup"></div>
          <small class="fine" data-i18n="blocked_idle_lock_hint"></small>
        </fieldset>
        <label class="remember">
          <input type="checkbox" id="remember" class="toggle">
          <span data-i18n="blocked_remember"></span>
        </label>
        <div class="unlock-row">
          <input type="password" required="true" autocomplete="off"
            data-i18n="blocked_password_ph" data-i18n-value="placeholder">
          <button type="submit" id="unlock" class="btn-primary" data-i18n="blocked_unlock"></button>
        </div>
      </form>

      <details id="details">
        <summary data-i18n="blocked_details"></summary>
        <dl>
          <dt data-i18n="blocked_title" id="title-label"></dt>
          <dd id="title">...</dd>
          <dt data-i18n="blocked_rule" id="rule-label" hidden></dt>
          <dd id="rule" data-i18n="blocked_rule_ph" data-i18n-value="placeholder" hidden></dd>
          <dt data-i18n="blocked_since"></dt>
          <dd id="date"></dd>
          <dt data-i18n="blocked_counter"></dt>
          <dd id="counter"></dd>
          <dt data-i18n="blocked_note" id="note-label" hidden></dt>
          <dd><textarea id="note" rows="2" data-i18n="blocked_note_ph" data-i18n-value="placeholder" hidden></textarea></dd>
        </dl>
      </details>
    </section>

    <footer>
      <a href="#" id="rate" data-i18n="blocked_rate" data-hide=true>-</a>
      <a href="#" id="exception">-</a>
      <a href="#" id="options" data-i18n="blocked_options"></a>
    </footer>
  </main>
  <notification-view id="toast"></notification-view>
  <button type="button" id="switch" class="btn-ghost" title="Theme" aria-label="Theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8"/>
      <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
    </svg>
  </button>

  <script src="/data/components/notification-view/notification-view.js"></script>
  <script src="/utils.js"></script>
  <script src="tld.js"></script>
  <script src="index.js"></script>
  <script src="rate.js"></script>
</body>
</html>
