<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/data/theme.css">
  <link rel="stylesheet" href="index.css">
  <title>Block Site</title>
  <link rel="icon" type="image/png" href="/data/icons/32.png">
</head>
<body>
  <!-- the current site: its icon, name and status, then one action -->
  <section id="site">
    <div class="identity">
      <span class="icon" aria-hidden="true">
        <img id="favicon" alt="" hidden>
        <span id="monogram"></span>
      </span>
      <div class="names">
        <span id="host">…</span>
        <span id="status"></span>
      </div>
    </div>

    <div class="scope" id="scope" role="radiogroup" hidden>
      <label><input type="radio" name="scope" value="site"><span data-i18n="popup_scope_site"></span></label>
      <label><input type="radio" name="scope" value="page"><span data-i18n="popup_scope_page"></span></label>
    </div>

    <button type="button" id="action" class="btn-primary" hidden></button>
    <p id="warning" role="alert"></p>
  </section>

  <div id="unlocked" hidden>
    <span id="unlocked-count"></span>
    <button type="button" class="btn-primary" id="lock-now" data-i18n="popup_lock_now"></button>
  </div>
  <button type="button" id="autolock" class="btn-ghost">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
    <span id="autolock-text"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
  </button>

  <script src="/data/blocked/tld.js"></script>
  <script src="/utils.js"></script>
  <script src="index.js"></script>
</body>
</html>
